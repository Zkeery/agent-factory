name: macOS runner checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  runner:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          mkdir -p data
      - name: Process and API checks
        working-directory: backend
        run: python -m pytest tests/test_runner_http.py tests/test_runner_process.py tests/test_runner_state.py tests/test_deploy.py tests/test_agent_harness.py tests/test_api.py -q --tb=line
