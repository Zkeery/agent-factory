<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向 2 · 深色科技感</title>
<style>
  :root{
    --bg:#0b0f1a; --surface:#141a2a; --surface-2:#1a2134; --text:#e8ecf6; --muted:#8b95ad; --line:#232c42;
    --p1:#6366f1; --p2:#a855f7; --p3:#22d3ee; --grad:linear-gradient(135deg,#6366f1,#a855f7);
    --glow:0 0 0 1px rgba(99,102,241,.35),0 16px 40px rgba(99,102,241,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(99,102,241,.28),transparent),radial-gradient(ellipse 60% 40% at 80% 110%,rgba(168,85,247,.18),transparent)}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(11,15,26,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;box-shadow:0 0 20px rgba(139,92,246,.5)}
  .brand h1{font-size:16px;font-weight:700}
  .brand p{font-size:12px;color:var(--muted);margin-top:1px}
  .layout{max-width:1180px;margin:0 auto;padding:26px 24px;display:flex;gap:26px}
  .side{width:190px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
  .side a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;transition:.15s}
  .side a:hover{background:var(--surface-2);color:var(--text)}
  .side a.on{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(139,92,246,.4)}
  .side .new{margin-top:18px;background:transparent;color:#fff;border:1px solid rgba(139,92,246,.6);border-radius:12px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .side .new:hover{background:var(--grad)}
  .main{flex:1;display:flex;flex-direction:column;gap:20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--glow)}
  .card h2{font-size:14px;font-weight:700;margin-bottom:14px}
  textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;font-family:inherit;resize:vertical;background:var(--surface-2);color:var(--text);outline:none}
  textarea:focus{border-color:var(--p1)}
  .btn{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--grad);color:#fff;border:none;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(139,92,246,.4)}
  .steps{display:flex;flex-wrap:wrap;gap:6px}
  .step{font-size:12px;padding:5px 12px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
  .step.now{background:var(--grad);color:#fff;font-weight:600}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .m{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .m .l{font-size:12px;color:var(--muted)}
  .m .v{font-size:20px;font-weight:700;color:#a5b4fc;margin-top:4px}
</style>
</head>
<body>
  <header class="topbar"><div class="topbar-in">
    <div class="brand"><div class="logo">造</div><div><h1>Agent造物坊</h1><p>AI 产品工厂</p></div></div>
    <div style="font-size:13px;color:var(--muted)">把想法做成可上线的 AI 产品</div>
  </div></header>
  <div class="layout">
    <aside class="side">
      <a class="on" href="#">✦ 造物</a>
      <a href="#">☰ 任务</a>
      <a href="#">◫ 度量</a>
      <button class="new">＋ 新建</button>
    </aside>
    <main class="main">
      <section class="card">
        <h2>提交想法</h2>
        <textarea placeholder="例如：做一个给宠物起名字的小工具"></textarea>
        <button class="btn">✦ 提交，启动流水线</button>
      </section>
      <section class="card">
        <h2>进度</h2>
        <div class="steps">
          <span class="step">提交想法</span><span class="step">澄清中</span><span class="step">等待回答</span>
          <span class="step now">生成 PRD</span><span class="step">构建中</span><span class="step">测试中</span>
        </div>
      </section>
      <section class="card">
        <h2>工厂度量</h2>
        <div class="metrics">
          <div class="m"><div class="l">稳定出货率</div><div class="v">62.5%</div></div>
          <div class="m"><div class="l">平均耗时</div><div class="v">8.2s</div></div>
          <div class="m"><div class="l">平均成本</div><div class="v">¥0.004</div></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
